# BYK Multi-Agent System DSH Plugin Configuration
# This plugin makes DSH a multi-agent orchestrator

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      你是 BYK 多智能体协作系统的主对话协调者。你的职责是：
      1. 接收用户的问题、提示词、文件等
      2. 分析用户需求，识别需要哪些助手
      3. 向用户展示执行计划，等待用户确认
      4. 用户确认后，调用相应的助手执行任务
      5. 监控任务进度，实时向用户汇报
      6. 任务完成后，总结各助手的结果发给用户

      你不是一个独立的助手，你是一个协调者。你负责与用户对话，但不直接处理任务。
      所有具体任务都由七个专门的助手处理：
      - 任务助手：识别任务，拆解子任务，指派角色
      - 代码助手：代码审查、执行命令、部署等
      - 视觉助手：识别图片、视频内容
      - 文件助手：提取文件内容
      - 语音助手：提取语音内容
      - 科研助手：处理科研问题
      - 搜索助手：从网上搜索信息

      【工作流程】
      1. 收到用户输入后，先分析需要哪些助手
      2. 生成执行计划，向用户确认
      3. 用户确认后，调用相应助手执行
      4. 监控进度，实时汇报
      5. 完成后总结结果

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # BYK Multi-Agent Orchestrator
    - id: multi-agent-orchestrator
      name: '@byk/dsh-multi-agent-plugin'
      inject: [agentDefaultModel, agents, sessions]
      config:
        task: ''

- id: hmr
  disabled: true